name: SwipeVault CI

on:
  push:
    branches: [main, "phase/**", "feat/**", "fix/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: swipevault_test
          POSTGRES_USER: swipevault
          POSTGRES_PASSWORD: swipevault_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U swipevault -d swipevault_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip && pip install ".[dev]"
      - run: ruff check app tests alembic
      - env:
          DATABASE_URL: postgresql+psycopg://swipevault:swipevault_test_pw@localhost:5432/swipevault_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
